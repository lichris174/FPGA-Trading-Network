[project]
name = "fpga-trading-network"
version = "0.0.1"
description = "Tick-to-decision trading pipeline in Verilog, verified against a Python golden model"
requires-python = ">=3.10"
dependencies = [
    "cocotb>=2.0,<3",
    "pytest>=8",
    "numpy>=1.26",
]

# Training only. Optional so CI and the golden model don't pull in PyTorch:
#   pip install -e ".[train]"
[project.optional-dependencies]
train = ["torch>=2.4", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["golden", "golden.itch", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
